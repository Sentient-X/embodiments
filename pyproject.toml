[project]
name = "sx-embodiments"
version = "0.1.0"
description = "The canonical embodiment registry over the sx-contracts asset vocabulary, shared across Sentient-X services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["sx-contracts>=0.1.0"]

[tool.uv.sources]
sx-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sx_embodiments"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "sx_embodiments/_assets"

[tool.ruff]
src = [".", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "T20", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sx_embodiments"]

[tool.pyright]
include = ["sx_embodiments", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
