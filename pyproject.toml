[project]
name = "sx-embodiments"
version = "0.1.0"
description = "Dependency-free embodiment and robotics asset manifests shared across Sentient-X services."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sx_embodiments"]

[tool.hatch.build.targets.sdist]
# Description assets (URDF/MJCF + meshes) are repo data resolved via
# sx_embodiments.assets.asset_root(); they never ship in distributions.
exclude = ["assets/"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "T20", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sx_embodiments"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
