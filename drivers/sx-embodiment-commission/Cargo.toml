[package]
name = "sx-embodiment-commission"
description = "Find a robot's bridges and what answers on them, read-only, and commission its ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sx-commission"
path = "src/main.rs"

[dependencies]
sx-embodiment-drivers.workspace = true
sx-feetech-serial = { path = "../sx-feetech-serial" }
sx-damiao-can = { path = "../sx-damiao-can" }
sx-zlg-usbcanfd = { path = "../sx-zlg-usbcanfd" }
sx-realtime.workspace = true
# Its frame layout and host needs build anywhere; the socket itself only on Linux.
sx-socketcan = { path = "../sx-socketcan" }
# Bench tools open and observe a body through the embodiment layer, never by vendor frames.
sx-embodiment-bodies = { path = "../sx-embodiment-bodies", features = ["usb-serial", "zlg"] }
serde.workspace = true
serde_json.workspace = true
ctrlc = "3"
thiserror.workspace = true
serialport = { version = "4.7", default-features = false }
nusb = "0.2"
# Caught SIGINT/SIGTERM/SIGHUP/SIGQUIT set a flag `calibrate` checks; `unsafe_code` is forbidden here.
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
sx-embodiment-bodies = { path = "../sx-embodiment-bodies", features = ["socketcan"] }

[dev-dependencies]
sx-damiao-can = { path = "../sx-damiao-can", features = ["sim"] }
sx-feetech-serial = { path = "../sx-feetech-serial", features = ["sim"] }
nix = { version = "0.30", default-features = false, features = ["term", "signal", "process"] }

[lints]
workspace = true
