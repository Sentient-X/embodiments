[package]
name = "sx-uvc-stereo"
description = "Side-by-side UVC stereo cameras (Stereolabs ZED 2i) as media-plan FrameSources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[features]
# Open real devices through `nokhwa` (V4L2 on Linux, AVFoundation on macOS). Without it the
# crate builds anywhere: the request, the mode table, the side-by-side split and the source
# over any `Device`, which the tests drive with synthetic frames.
capture = ["dep:nokhwa", "dep:v4l", "dep:sx-capture-usb"]

[dependencies]
sx-embodiment-drivers.workspace = true
thiserror.workspace = true
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-v4l", "input-avfoundation"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The V4L2 capture `nokhwa` wraps, driven directly so a read waits at most `capture::STALL`.
v4l = { version = "=0.14.0", optional = true }
# usbfs (`USBDEVFS_RESET`): each stream starts on a freshly reset device (`capture::fresh`).
sx-capture-usb = { path = "../sx-capture-usb", optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "zed_read"
required-features = ["capture"]
