[package]
name = "sx-feetech-serial"
description = "Feetech STS servos over their serial bus, ported from Feetech's own scservo_sdk, and the SO-101 chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# scservo_sdk.rs translates ftservo's MIT-licensed scservo_sdk (LICENSE-THIRD-PARTY).
license = "Apache-2.0 AND MIT"
publish.workspace = true

[features]
# A simulated Feetech bus answering as STS3215 firmware does, for the suites of every crate
# that drives a Feetech body (`sim`).
sim = []

[dependencies]
sx-embodiment-drivers.workspace = true
thiserror.workspace = true

[dev-dependencies]
sx-feetech-serial = { path = ".", features = ["sim"] }
# Counts a test's heap allocations (its own global allocator; this crate forbids unsafe code).
allocation-counter = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
