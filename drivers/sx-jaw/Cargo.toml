[package]
name = "sx-jaw"
description = "The one YUBI jaw solver: ArUco finger tags sighted on the wrist camera's luma, their hinge angle, and one robust smoother over tags and encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
serde_json.workspace = true
# The examples time the sighting in this thread's CPU time, not wall time.
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Small fixed-size matrix arithmetic reads best indexed.
needless_range_loop = "allow"
