[package]
name = "sx-realtime"
description = "The host's real-time policy for the threads a robot's control and answer paths run on: Mach time constraint on macOS, SCHED_FIFO on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.5"

# The workspace forbids unsafe code; this crate is where a thread's scheduling policy is set,
# which only system calls can do, so it denies unsafe everywhere but its two platform modules,
# where every block says why it is sound.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
