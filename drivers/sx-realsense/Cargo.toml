[package]
name = "sx-realsense"
description = "Intel RealSense D400 cameras as media-plan FrameSources, through librealsense2's own SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true

[features]
# Open real devices through librealsense2 (`realsense-rust`, which links the system's
# librealsense2 2.x through pkg-config). Without it the crate builds anywhere: the request,
# clock, image and factory-record logic, and the recorded device the tests replay.
sdk = ["dep:realsense-rust"]

[dependencies]
sx-embodiment-drivers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
realsense-rust = { version = "=1.3.0", optional = true }

[lints]
workspace = true
