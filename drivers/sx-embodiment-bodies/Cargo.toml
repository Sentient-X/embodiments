[package]
name = "sx-embodiment-bodies"
description = "Open any registered body's actuator chain from its robot instance's drive and the station's commissioned ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Open commissioned USB serial bridges (Damiao's USB2CAN, and Feetech and Dynamixel servo
# adapters) on Linux, found by their USB serial
# number in sysfs. Without it the crate builds anywhere and a port source is the caller's.
usb-serial = ["dep:serialport"]
# Open commissioned SocketCAN interfaces (`can1`) on Linux, found by their USB adapter's serial
# number, or their own name for a controller on the board. Off Linux only the lookup builds.
socketcan = ["dep:sx-socketcan"]
# Open commissioned ZLG USBCANFD channels (`<USB serial>:<channel>`) in userspace over USB, on
# Linux and macOS.
zlg = ["dep:sx-zlg-usbcanfd"]

[dependencies]
sx-embodiment-drivers.workspace = true
sx-damiao-can = { path = "../sx-damiao-can" }
sx-feetech-serial = { path = "../sx-feetech-serial" }
sx-dynamixel-serial = { path = "../sx-dynamixel-serial" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serialport = { version = "4.7", default-features = false, optional = true }
sx-socketcan = { path = "../sx-socketcan", optional = true }
sx-zlg-usbcanfd = { path = "../sx-zlg-usbcanfd", optional = true }

[dev-dependencies]
sx-damiao-can = { path = "../sx-damiao-can", features = ["sim"] }
sx-feetech-serial = { path = "../sx-feetech-serial", features = ["sim"] }

[lints]
workspace = true
