[workspace]
resolver = "3"
members = [
    "drivers/sx-yubi",
    "drivers/sx-capture-usb",
    "drivers/sx-capture-linux",
    "drivers/sx-embodiment-drivers",
    "drivers/sx-damiao-can",
    "drivers/sx-feetech-serial",
    "drivers/sx-dynamixel-serial",
    "drivers/sx-realsense",
    "drivers/sx-uvc-stereo",
    "drivers/sx-stereolabs-sensors",
    "drivers/sx-realtime",
    "drivers/sx-socketcan",
    "drivers/sx-zlg-usbcanfd",
    "drivers/sx-embodiment-bodies",
    "drivers/sx-embodiment-commission",
    "drivers/sx-embodiment-ik",
    "drivers/sx-frames",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
# Apache-2.0 covers Sentient-X's own code; vendor-derived modules carry their own notice
# (drivers/*/LICENSE-THIRD-PARTY) and crate licence expression.
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sx-yubi = { path = "drivers/sx-yubi" }
sx-embodiment-drivers = { path = "drivers/sx-embodiment-drivers" }
sx-realtime = { path = "drivers/sx-realtime" }
sx-frames = { path = "drivers/sx-frames" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# The teleop solve's tests drive thousands of steps a case: unoptimised they took 170 s of the
# gate and, their floats rounded differently from release, measured different clearances.
[profile.dev.package.sx-embodiment-ik]
opt-level = 3

[profile.dev.package.sx-frames]
opt-level = 3
