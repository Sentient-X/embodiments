[workspace]
resolver = "3"
members = ["drivers/sx-embodiment-drivers", "drivers/sx-damiao-can"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
# Apache-2.0 covers Sentient-X's own code; vendor-derived modules carry their own notice
# (drivers/sx-damiao-can/LICENSE-THIRD-PARTY) and crate licence expression.
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sx-embodiment-drivers = { path = "drivers/sx-embodiment-drivers" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
